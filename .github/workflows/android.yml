name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_reel:
        description: Canonical public Reel URL for the optional API 36 live save gate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[36]' || '[29,35,36]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Build standalone control diagnostic
        if: matrix.api == 36
        run: ./gradlew --no-daemon :device-probe:assembleDebug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: matrix.api == 36
        with:
          name: device-control-diagnostic
          path: device-probe/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Record runtime dependency graph
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > app/build/reports/runtime-dependencies.txt
      - name: Show lint diagnostics
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          LIVE_REEL: ${{ inputs.live_reel }}
          API_LEVEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/run_device_tests.py
      - name: Summarize verification evidence
        if: failure()
        run: python3 scripts/summarize_checks.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-api-${{ matrix.api }}-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
